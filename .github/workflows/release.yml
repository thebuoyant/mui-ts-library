name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to (re-)release, e.g. v3.24.0 — leave empty to use current package.json version'
        required: false
        type: string

jobs:
  release:
    name: Build & publish GitHub Release + npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version from package.json
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Skip if release already exists
        id: check
        run: |
          TAG="${{ inputs.tag_name || steps.pkg.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null 2>&1; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "Release $TAG already exists — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Test → Build → Pack
        if: steps.check.outputs.skip == 'false'
        run: npm run pack-release

      - name: Publish GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || steps.pkg.outputs.version }}
          name: ${{ inputs.tag_name || steps.pkg.outputs.version }}
          files: releases/*.tgz
          generate_release_notes: true

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
