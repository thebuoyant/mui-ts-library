name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v3.24.0) — use to recover a failed automatic release'
        required: true
        type: string

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_dispatch: explicitly resolve as a tag ref, not a branch.
          # For tag push: github.ref is already refs/tags/vX.Y.Z.
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test → Build → Pack
        run: npm run pack-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          files: releases/*.tgz
          generate_release_notes: true
