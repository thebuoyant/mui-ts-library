name: Deploy Storybook to GitHub Pages

# Runs on every push to main — always reflects the latest state of the library.
on:
  push:
    branches:
      - main

# Required for GitHub Pages deployment via OIDC (no PAT needed).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time — cancel in-progress if a newer push arrives.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
